# Throwaway WASM bridge for benchmarking sudoku-core. Not the app's bridge.
# Build (needs target wasm32-unknown-unknown and wasm-bindgen-cli matching Cargo.lock):
#   cargo build --release --target wasm32-unknown-unknown
#   wasm-bindgen target/wasm32-unknown-unknown/release/nona_bridge.wasm --target nodejs --out-dir pkg-node
#   wasm-bindgen target/wasm32-unknown-unknown/release/nona_bridge.wasm --target web --out-dir pkg-web
#   cargo build --release --example native
# Run: node js/bench.mjs [--seeded] | node js/serve.mjs "seeded=1" | target/release/examples/native [seeded]
# package.json declares commonjs: the parent package is "type": "module" and pkg-node is CommonJS.

[package]
name = "nona-bridge"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sudoku-core = { git = "https://github.com/kcirtapfromspace/sudoku-core", rev = "84696be" }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
