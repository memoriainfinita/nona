# WASM bridge between the app and sudoku-core. Built by `pnpm build:engine`
# (scripts/build-engine.mjs): cargo -> wasm-bindgen -> wasm-opt, output in engine/pkg.
# wasm-bindgen is pinned: the wasm-bindgen CLI must match it exactly.

[package]
name = "nona-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sudoku-core = { git = "https://github.com/memoriainfinita/sudoku-core", rev = "f56364e" }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
